[project]
name = "privacy-desk-backend"
version = "0.1.0"
description = "基于大模型的文本隐私信息智能脱敏系统后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=43.0.0",
    "python-docx>=1.1.2",
    "pdfplumber>=0.11.4",
    "reportlab>=4.2.2",
    "httpx>=0.27.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pyinstaller>=6.10.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
